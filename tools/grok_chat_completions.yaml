    label:
      en_US: grok-4.7
      zh_Hans: grok-4.7
  - value: grok-4.5
    label:
      en_US: grok-4.5
      zh_Hans: grok-4.5
  - value: grok-4
    label:
      en_US: grok-4
      zh_Hans: grok-4
  - value: grok-3
    label:
      en_US: grok-3
      zh_Hans: grok-3
- name: messages
  type: string
  required: true
  form: llm
