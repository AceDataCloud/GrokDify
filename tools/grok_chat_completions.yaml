    zh_Hans: top logprobs
  human_description:
    en_US: Set top logprobs for this operation.
    zh_Hans: 取值为 0 到 20 之间的整数，指定在每个 token 位置返回的最可能 token 的数量，每个都附带对应的对数概率。使用该参数时，`logprobs`
      必须设置为 `true`。
  llm_description: Set top logprobs for this operation.
