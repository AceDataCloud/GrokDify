    zh_Hans: 随机种子
  human_description:
    en_US: Set seed for this operation.
    zh_Hans: 若指定，系统将尽力进行确定性采样，使得使用相同 `seed` 和参数的重复请求返回相同结果。确定性无法保证；请参考响应中的 `system_fingerprint`
      来监控后端变更。
  llm_description: Set seed for this operation.
- name: stop
  type: string
