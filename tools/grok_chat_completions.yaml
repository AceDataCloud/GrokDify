    en_US: Max Tokens
    zh_Hans: max tokens
  human_description:
    en_US: Set max tokens for this operation.
    zh_Hans: 对话补全中可生成的最大 token 数量。
  llm_description: Set max tokens for this operation.
- name: temperature
  type: number
  required: false
  form: form
  label:
    en_US: Temperature
    zh_Hans: 温度
  human_description:
    en_US: Set temperature for this operation.
    zh_Hans: 使用的采样温度，取值在 0 到 2 之间。较高的值（如 0.8）会使输出更随机，较低的值（如 0.2）会使输出更聚焦、更确定。
  llm_description: Set temperature for this operation.
  min: 0
  max: 2
- name: top_p
  type: number
  required: false
  form: form
  label:
    en_US: Top P
    zh_Hans: Top P
  human_description:
    en_US: Set top p for this operation.
    zh_Hans: 温度采样的一种替代方法，称为核采样（nucleus sampling），模型仅考虑累计概率质量达到 top_p 的那部分 token。例如
      0.1 表示只考虑累计概率质量前 10% 的 token。通常建议只调整该参数或 `temperature` 之一，而非同时调整两者。
  llm_description: Set top p for this operation.
  min: 0
  max: 1
- name: frequency_penalty
  type: number
  required: false
  form: form
  label:
    en_US: Frequency Penalty
    zh_Hans: frequency penalty
  human_description:
    en_US: Set frequency penalty for this operation.
    zh_Hans: 取值在 -2.0 到 2.0 之间。正值会根据 token 在已生成文本中出现的频率进行惩罚，从而降低模型逐字重复同一行的可能性。
  llm_description: Set frequency penalty for this operation.
  min: -2
  max: 2
- name: presence_penalty
  type: number
  required: false
  form: form
  label:
    en_US: Presence Penalty
    zh_Hans: presence penalty
  human_description:
    en_US: Set presence penalty for this operation.
    zh_Hans: 取值在 -2.0 到 2.0 之间。正值会根据 token 是否已在已生成文本中出现进行惩罚，从而提高模型谈论新话题的可能性。
  llm_description: Set presence penalty for this operation.
  min: -2
  max: 2
- name: seed
  type: number
  required: false
  form: form
  label:
