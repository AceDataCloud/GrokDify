identity:
  name: grok_chat_completions
  author: acedatacloud
  label:
    en_US: Grok Video Chat Completions
    zh_Hans: Grok Video 对话生成
description:
  human:
    en_US: Chat Completions through the Ace Data Cloud Grok Video API.
    zh_Hans: 通过 Ace Data Cloud Grok Video API 执行 Chat Completions。
  llm: Chat Completions through the Ace Data Cloud Grok Video API. For asynchronous
    results, preserve task_id and use the task retrieval tool until completion. A
    successful submission is not completed output.
parameters:
- name: n
  type: number
  required: false
  form: form
  label:
    en_US: N
    zh_Hans: 图片数量
  human_description:
    en_US: Set n for this operation.
    zh_Hans: 为每条输入消息生成多少个对话补全选项。
  llm_description: Set n for this operation.
  min: 1
  max: 128
- name: model
  type: select
  required: true
  form: form
  label:
    en_US: Model
    zh_Hans: 模型
