identity:
  name: grok_generate_video
  author: acedatacloud
  label:
    en_US: Grok Generate Video
    zh_Hans: Grok 生成视频
description:
  human:
    en_US: Generate videos with Ace Data Cloud Grok Imagine Videos API (text-to-video
      or image-to-video).
    zh_Hans: 通过 Ace Data Cloud Grok Imagine Videos API 生成视频（文生视频或图生视频）。
  llm: Generate a video from a text prompt and/or an input image via Ace Data Cloud
    Grok Imagine Videos API. Generation returns a task ID. Query the same task until
    complete; never resubmit a pending generation.
parameters:
- name: prompt
  type: string
  required: false
  label:
    en_US: Prompt
    zh_Hans: 提示词
  human_description:
    en_US: Text description. Required for text-to-video; optional when an image_url
      is provided.
    zh_Hans: 文本提示词。文生视频必填；提供 image_url 时可选。
  llm_description: Text description. Required for text-to-video; optional when an
    image_url is provided.
  form: llm
- name: model
  type: select
  required: false
  label:
    en_US: Model
    zh_Hans: 模型
  human_description:
    en_US: Select the current API model for this operation.
    zh_Hans: 用于生成视频的模型。`grok-imagine-video-1.5-fast` 支持文本生成视频和图像生成视频，时长最长 30 秒；`grok-imagine-video-1.5`
      仅支持图像生成视频，必须提供 `image_url`，时长最长 15 秒。
  llm_description: Select the current API model for this operation.
  form: form
  default: grok-imagine-video-1.5-fast:reverse
  options:
  - value: grok-imagine-video-1.5-fast:reverse
    label:
      en_US: grok-imagine-video-1.5-fast:reverse
      zh_Hans: grok-imagine-video-1.5-fast:reverse
  - value: grok-imagine-video:reverse
    label:
      en_US: grok-imagine-video:reverse
      zh_Hans: grok-imagine-video:reverse
  - value: grok-imagine-video:official
    label:
      en_US: grok-imagine-video:official
      zh_Hans: grok-imagine-video:official
  - value: grok-imagine-video-1.5:official
    label:
      en_US: grok-imagine-video-1.5:official
      zh_Hans: grok-imagine-video-1.5:official
  - value: grok-imagine-video
    label:
      en_US: grok-imagine-video
      zh_Hans: grok-imagine-video
- name: image_url
  type: string
  required: false
  label:
    en_US: Image URL
    zh_Hans: 图片链接
  human_description:
    en_US: Input image to animate (image-to-video). Required for grok-imagine-video-1.5-preview.
    zh_Hans: 用于图生视频的输入图片链接。grok-imagine-video-1.5-preview 必填。
  llm_description: Input image to animate (image-to-video). Required for grok-imagine-video-1.5-preview.
  form: form
- name: reference_image_urls
  type: string
  required: false
  label:
    en_US: Reference Image URLs
    zh_Hans: 参考图片链接
  human_description:
    en_US: Optional reference images to guide the style/content (array, JSON array
      string, or one per line). Enter a JSON array.
    zh_Hans: 可选参考图片，用于引导风格/内容（数组、JSON 数组字符串或每行一个）。 请填写 JSON 数组。
  llm_description: Optional reference images to guide the style/content (array, JSON
    array string, or one per line). Enter a JSON array.
  form: form
- name: aspect_ratio
  type: select
  required: false
  label:
    en_US: Aspect ratio
    zh_Hans: 画面比例
  human_description:
    en_US: Optional output aspect ratio.
    zh_Hans: 可选输出画面比例。
  llm_description: Optional output aspect ratio.
  form: form
  options:
  - value: '1:1'
    label:
      en_US: '1:1'
      zh_Hans: '1:1'
  - value: '16:9'
    label:
      en_US: '16:9'
      zh_Hans: '16:9'
  - value: '9:16'
    label:
      en_US: '9:16'
      zh_Hans: '9:16'
  - value: '4:3'
    label:
      en_US: '4:3'
      zh_Hans: '4:3'
  - value: '3:4'
    label:
      en_US: '3:4'
      zh_Hans: '3:4'
  - value: '3:2'
    label:
      en_US: '3:2'
      zh_Hans: '3:2'
  - value: '2:3'
    label:
      en_US: '2:3'
      zh_Hans: '2:3'
- name: resolution
  type: select
  required: false
  label:
    en_US: Resolution
    zh_Hans: 分辨率
  human_description:
    en_US: Optional output resolution. Default 480p.
    zh_Hans: 可选输出分辨率，默认 480p。
  llm_description: Optional output resolution. Default 480p.
  form: form
  default: 480p
  options:
  - value: 480p
    label:
      en_US: 480p
      zh_Hans: 480p
  - value: 720p
    label:
      en_US: 720p
      zh_Hans: 720p
  - value: 1080p
    label:
      en_US: 1080p
      zh_Hans: 1080p
- name: duration
  type: number
  required: false
  label:
    en_US: Duration (seconds)
    zh_Hans: 时长（秒）
  human_description:
    en_US: Optional video duration in seconds (1-15, default 8). Billed per output
      second.
    zh_Hans: 可选视频时长（秒），范围 1-15，默认 8。按输出秒数计费。
  llm_description: Optional video duration in seconds (1-15, default 8). Billed per
    output second.
  form: form
  default: 6
output_schema:
  type: object
  properties:
    status:
      type: string
    success:
      type: boolean
    task_id:
      type: string
    trace_id:
      type: string
    media_urls:
      type: array
      items:
        type: string
    data: {}
    result:
      type: object
extra:
  python:
    source: tools/grok_generate.py
